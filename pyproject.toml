[project]
name = "sidecar"
version = "0.1.0"
description = "Customer discovery workbench: hypotheses, evidence, outreach, and a live interview coach."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Preston Brown" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "anthropic>=1.12",
    "fastapi>=0.142",
    "httpx2>=2.13",
    "numpy>=2.5",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "sounddevice>=0.5.6",
    "uvicorn>=0.54",
    "websockets>=17.2",
]

[project.scripts]
coach = "coach.cli:main"
sidecar = "sidecar.cli:main"
sidecar-engine = "sidecar.engine:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach", "src/sidecar"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ANN", "RUF", "C4", "PIE", "RET", "PT", "BLE"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
