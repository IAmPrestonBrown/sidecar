[package]
name = "sidecar"
version = "0.1.0"
description = "Desktop shell for Sidecar"
authors = ["Preston Brown"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "sidecar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-log = "2"
